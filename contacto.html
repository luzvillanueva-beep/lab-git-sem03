<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f1e7; color: #3e2723; margin: 0;">

    <nav style="background-color: #6d4c41; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: white; margin: 15px; text-decoration: none;">Nosotros</a>
        <a href="contact.html" style="color: white; margin: 15px; text-decoration: none;">Contacto</a>
    </nav>

    <main style="padding: 40px; text-align: center;">
        <h1 style="color: #4e342e;">Contáctanos</h1>

        <p>📍 Dirección: Av. Principal 123</p>
        <p>📞 Teléfono: 999 999 999</p>
        <p>📧 Email: contacto@cafearoma.com</p>

        <h2>Envíanos un mensaje</h2>

        <form>
            <input
                type="text"
                placeholder="Tu nombre"
                style="padding: 10px; margin: 5px;"
            >
            <br>

            <input
                type="email"
                placeholder="Tu correo"
                style="padding: 10px; margin: 5px;"
            >
            <br>

            <textarea
                placeholder="Tu mensaje"
                style="padding: 10px; margin: 5px; width: 250px; height: 100px;"
            ></textarea>
            <br>

            <button
                type="submit"
                style="background-color: #6d4c41; color: white; padding: 10px 20px; border: none; cursor: pointer;"
            >
                Enviar
            </button>
        </form>
    </main>

</body>
</html>
